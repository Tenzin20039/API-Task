<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task List</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- The dining room: what guests see. All data comes from the kitchen (the API). -->
  <main class="card">
    <h1>Task List</h1>

    <form id="task-form">
      <input id="task-input" type="text" placeholder="What needs doing?" maxlength="255" autocomplete="off" />
      <button type="submit">Add</button>
    </form>

    <p id="message" class="message" hidden></p>

    <div class="filters">
      <button class="filter active" data-filter="all">All</button>
      <button class="filter" data-filter="active">Active</button>
      <button class="filter" data-filter="done">Done</button>
      <span id="count" class="count"></span>
    </div>

    <ul id="task-list"></ul>
    <p id="empty" class="empty" hidden>No tasks here yet.</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
